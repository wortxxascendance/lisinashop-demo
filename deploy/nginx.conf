# Пример настройки nginx для lisinashop.ru. Положите в /etc/nginx/sites-available/lisinashop и включите.
# HTTPS: после certbot --nginx блок listen 443 и сертификаты добавятся сами.
# Папка /var/www/lisinashop: содержимое проекта; сайт собран в dist/, сервер запущен на 127.0.0.1:3000.

server {
    listen 80;
    server_name lisinashop.ru www.lisinashop.ru;

    root /var/www/lisinashop/dist;
    index index.html;
    charset utf-8;

    # Адрес без www
    if ($host = www.lisinashop.ru) { return 301 https://lisinashop.ru$request_uri; }

    # Старые адреса Tilda -> новые (файл создаёт npm run build, лежит в deploy/redirects.generated.conf)
    include /var/www/lisinashop/deploy/redirects.generated.conf;

    # API магазина
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # именно $remote_addr: так посетитель не подделает свой адрес
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 128k;
    }

    # Страница статуса заказа: любой номер заказа открывает одну и ту же оболочку, дальше работает скрипт
    location ~ ^/order/ {
        try_files /order/index.html =404;
    }

    # Картинки, стили и скрипты: у стилей и скриптов в адресе ?v=хэш, поэтому кешируем надолго
    location ~* \.(?:webp|jpg|jpeg|png|svg|ico|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    # Сжатие
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Защитные заголовки. Strict-Transport-Security включите после проверки HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
